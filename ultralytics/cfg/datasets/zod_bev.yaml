# Train/val/test sets as 1) dir: path/to/imgs, 2) file: path/to/imgs.txt, or 3) list: [path/to/imgs1, path/to/imgs2, ..]
path: /home/heizung1/ultralytics_yolov8-obb_ob_kitti/ultralytics/cfg/datasets/master_thesis/zod # dataset root dir
#path: master_thesis/zod # dataset root dir
train: images/train # train images (relative to 'path') 24294 images
val: images/val # val images (relative to 'path') 3433 images 
test: # test images (optional)

# Classes in YOLO format (category_id starts at 0) 
